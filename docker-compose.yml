services:
  # PostgreSQL database
  db:
    image: postgres:16
    container_name: baseball-db
    environment:
      POSTGRES_DB: baseball_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
     - "5432:5432"
    volumes:
     - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d baseball_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Spring Boot backend
  backend:
    build: ./backend
    container_name: baseball_backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/baseball_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
     - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    
  # React frontend served through Nginx
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: baseball-frontend
    ports:
     - "3000:80"
    depends_on:
     - backend
volumes:
  postgres_data:
  